  // Initialize map centered on India using Canvas renderer for high performance across 22,726 points
  const map = L.map('map', {
    center: [21.5, 79.0],
    zoom: 5,
    preferCanvas: true
  });

  const esriImagery = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community | Data: GeoNames IN.csv',
    maxZoom: 18
  }).addTo(map);

  const openTopoMap = L.tileLayer('https://tile.opentopomap.org/{z}/{x}/{y}.png', {
    attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap (CC-BY-SA) | Data: GeoNames IN.csv',
    maxZoom: 17
  });

  const baseMaps = {
    "Esri World Imagery": esriImagery,
    "OpenTopoMap": openTopoMap
  };

  const overlayMaps = {};
  const canvasRenderer = L.canvas({ padding: 0.5 });

  layerMeta.forEach(meta => {
    const pts = layersData[String(meta.code)] || [];
    const group = L.layerGroup();

    pts.forEach(pt => {
      const [lat, lon, name, pop] = pt;
      const radius = pop > 500000 ? 6 : (pop > 100000 ? 4.5 : 3);
      const marker = L.circleMarker([lat, lon], {
        renderer: canvasRenderer,
        radius: radius,
        fillColor: meta.color,
        color: '#222',
        weight: pop > 100000 ? 0.6 : 0,
        opacity: 0.8,
        fillOpacity: 0.72
      });
      marker.bindPopup(
        `<strong>${name}</strong><br>` +
        `Code ${meta.code}: <b>${meta.label.split(': ')[1]}</b><br>` +
        `Strand: ${meta.strand}<br>` +
        `Population: ${pop.toLocaleString()}`
      );
      marker.addTo(group);
    });

    group.addTo(map);
    const layerTitle = `<span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${meta.color};margin-right:5px;"></span>${meta.label} (${pts.length.toLocaleString()})`;
    overlayMaps[layerTitle] = group;
  });

  // Add Layer Control (top-right)
  L.control.layers(baseMaps, overlayMaps, { collapsed: false }).addTo(map);

  // Add Title / Info Box (top-left)
  const info = L.control({ position: 'topleft' });
  info.onAdd = function() {
    const div = L.DomUtil.create('div', 'info-box');
    div.innerHTML = `
      <h4>Toponymic Suffixes of India</h4>
      <div>10 toggleable suffix layers from <code>IN_with_suffix_codes.csv</code> (22,726 representative settlements shown out of 124,976 matched places). Toggle layers on the right to isolate linguistic boundaries.</div>
    `;
    return div;
  };
  info.addTo(map);

  // Add Legend for Toponymic Strands (bottom-left)
  const legend = L.control({ position: 'bottomleft' });
  legend.onAdd = function() {
    const div = L.DomUtil.create('div', 'legend');
    let html = '<div class="legend-title">Toponymic Strands &amp; Suffix Codes</div>';
    layerMeta.forEach(meta => {
      html += `
        <div class="legend-item">
          <span class="legend-swatch" style="background:${meta.color};"></span>
          <div class="legend-text">
            <strong>${meta.label}</strong> <span style="color:#666;">(n=${meta.total.toLocaleString()})</span>
            <span class="legend-strand">${meta.strand}</span>
          </div>
        </div>
      `;
    });
    div.innerHTML = html;
    return div;
  };
  legend.addTo(map);
</script>
