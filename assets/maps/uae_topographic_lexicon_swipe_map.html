      border: 1px solid rgba(255,255,255,0.35);
    }

      position: absolute;
      top: 0;
      bottom: 0;
      left: 50%;
      width: 3px;
      background: #ffffff;

bu Dhabi", "elev": "261 m", "lexicon": "Falaj / Aflaj (Irrigation Channel)"}, {"name": "Falaj Al Mazmi", "ascii": "Falaj Al Mazmi", "lat": 24.27574, "lon": 55.77089, "fcode": "PPLX", "emirate": "Abu Dhabi", "elev": "286 m", "lexicon": "Falaj / Aflaj (Irrigation Channel)"}]}, "Ghayl / Ghail (Perennial Spring/Stream)": {"color": "#e377c2", "desc": "Perennial mountain spring or flowing wadi stream", "count": 10, "points": [{"name": "Wādī Ghayl", "ascii": "Wadi Ghayl", "lat": 25.39219, "lon": 56.29522, "fcode": "WAD", "emirate": "Fujairah", "elev": "126 m", "lexicon": "Ghayl / Ghail (Perennial Spring/Stream)"}, {"name": "Ţawī Ghayl", "ascii": "Tawi Ghayl", "lat": 25.40208, "lon": 56.05859, "fcode": "WLL", "emirate": "Ras Al Khaimah", "elev": "256 m", "lexicon": "Tawi (Lined Well); Ghayl / Ghail (Perennial Spring/Stream)"}, {"name": "Sayḩ Ghayl", "ascii": "Sayh Ghayl", "lat": 24.64143, "lon": 55.08696, "fcode": "TRGD", "emirate": "Abu Dhabi", "elev": "74 m", "lexicon": "Sayh / Saih (Gravel Plain); Ghayl / Ghail (Perennial Spring/Stream)"}, {"name": "Raml Ghayl", "ascii": "Raml Ghayl", "lat": 24.66667, "lon": 55.1, "fcode": "SAND", "emirate": "Abu Dhabi", "elev": "81 m", "lexicon": "Ghayl / Ghail (Perennial Spring/Stream)"}, {"name": "Ghayl", "ascii": "Ghayl", "lat": 25.40174, "lon": 56.06806, "fcode": "PPL", "emirate": "Ras Al Khaimah", "elev": "273 m", "lexicon": "Ghayl / Ghail (Perennial Spring/Stream)"}, {"name": "Ghayl", "ascii": "Ghayl", "lat": 25.00677, "lon": 56.3329, "fcode": "PPL", "emirate": "Sharjah", "elev": "11 m", "lexicon": "Ghayl / Ghail (Perennial Spring/Stream)"}, {"name": "Ahl Ghayl", "ascii": "Ahl Ghayl", "lat": 25.7, "lon": 56.1, "fcode": "TRB", "emirate": "Ras Al Khaimah", "elev": "605 m", "lexicon": "Ghayl / Ghail (Perennial Spring/Stream)"}, {"name": "Al Ghail", "ascii": "Al Ghail", "lat": 24.20815, "lon": 55.74223, "fcode": "PPLX", "emirate": "Abu Dhabi", "elev": "265 m", "lexicon": "Ghayl / Ghail (Perennial Spring/Stream)"}, {"name": "Wadi Ghayl", "ascii": "Wadi Ghayl", "lat": 25.76159, "lon": 56.1169, "fcode": "WAD", "emirate": "Ras Al Khaimah", "elev": "244 m", "lexicon": "Ghayl / Ghail (Perennial Spring/Stream)"}, {"name": "Deira Al Ghayl", "ascii": "Deira Al Ghayl", "lat": 25.77274, "lon": 56.13527, "fcode": "PPL", "emirate": "Ras Al Khaimah", "elev": "629 m", "lexicon": "Ghayl / Ghail (Perennial Spring/Stream)"}]}};

    const WATER_CATEGORIES = [
      "Tawi (Lined Well)",
      "Bid' / Bid'at (Newly Dug Well)",
      "Falaj / Aflaj (Irrigation Channel)",
      "Ghayl / Ghail (Perennial Spring/Stream)"
    ];

    const LANDFORM_CATEGORIES = [
      "Sayh / Saih (Gravel Plain)",
      "Khawr / Khor (Tidal Creek/Inlet)",
      "Naqa (Sand Dune/Hillock)",
      "Qarn (Isolated Peak/Horn)"
    ];

    const map = L.map('map', {
      center: [24.35, 54.45],
      zoom: 8
    });

    // Custom panes for clean left/right SVG clipping
    const waterPane = map.createPane('waterPane');
    waterPane.style.zIndex = 450;
    const landformPane = map.createPane('landformPane');
    landformPane.style.zIndex = 455;

    const waterRenderer = L.svg({ pane: 'waterPane' });
    const landformRenderer = L.svg({ pane: 'landformPane' });

    const satelliteTiles = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
      attribution: 'Tiles &copy; Esri &mdash; Source: Esri, Maxar, Earthstar Geographics, and the GIS User Community',
      maxZoom: 18
    }).addTo(map);

    const openTopoTiles = L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{y}/{x}.png', {
      attribution: 'Map data: &copy; OpenStreetMap contributors, SRTM | Map style: &copy; OpenTopoMap (CC-BY-SA)',
      maxZoom: 17
    });

    L.control.layers({
      "Satellite (Esri World Imagery)": satelliteTiles,
      "OpenTopoMap": openTopoTiles
    }, null, { position: 'topright' }).addTo(map);

    const layerGroups = {};
    const checkboxes = {};
    const items = {};
    const listContainer = document.getElementById('layerList');

    function buildSection(title, sideKey, categories) {
      const header = document.createElement('div');
      header.className = `group-header ${sideKey}`;
      header.innerHTML = `
        <span>${title}</span>
        <button class="group-toggle" onclick="toggleGroup('${sideKey}')">Toggle Group</button>
      `;
      listContainer.appendChild(header);

      const paneName = sideKey === 'water' ? 'waterPane' : 'landformPane';
      const renderer = sideKey === 'water' ? waterRenderer : landformRenderer;
      const sideBadgeColor = sideKey === 'water' ? '#1d4ed8' : '#b45309';
      const sideBadgeLabel = sideKey === 'water' ? 'LEFT PANE • WATER LEXICON' : 'RIGHT PANE • LANDFORM LEXICON';

      categories.forEach(layerName => {
        const info = LAYERS_DATA[layerName];
        if (!info) return;
        const group = L.layerGroup();

        info.points.forEach(pt => {
          const marker = L.circleMarker([pt.lat, pt.lon], {
            pane: paneName,
            renderer: renderer,
            radius: 6,
            fillColor: info.color,
            color: '#ffffff',
            weight: 1.2,
            opacity: 0.95,
            fillOpacity: 0.88
          });

          marker.bindPopup(`
            <div class="popup-side-tag" style="background:${sideBadgeColor}">${sideBadgeLabel}</div>
            <div class="popup-title">${pt.name}</div>
            <div class="popup-row"><strong>ASCII:</strong> ${pt.ascii}</div>
            <div class="popup-row"><strong>Lexicon:</strong> ${pt.lexicon}</div>
            <div class="popup-row"><strong>Emirate:</strong> ${pt.emirate}</div>
            <div class="popup-row"><strong>Feature Code:</strong> ${pt.fcode} | <strong>DEM:</strong> ${pt.elev}</div>
            <div class="popup-row"><strong>Coords:</strong> ${pt.lat}, ${pt.lon}</div>
          `);
          marker.addTo(group);
        });

        group.addTo(map);
        layerGroups[layerName] = group;

        const item = document.createElement('div');
        item.className = 'layer-item';
        item.innerHTML = `
          <input type="checkbox" checked />
          <span class="swatch" style="background:${info.color}"></span>
          <div class="layer-info">
            <div class="layer-title-row">
              <span class="layer-title">${layerName}</span>
              <span class="badge">${info.count}</span>
            </div>
            <div class="layer-desc">${info.desc}</div>
          </div>
        `;

        const cb = item.querySelector('input');
        checkboxes[layerName] = cb;
        items[layerName] = item;

        item.addEventListener('click', (e) => {
          if (e.target !== cb) cb.checked = !cb.checked;
          setLayerVisibility(layerName, cb.checked);
        });

        listContainer.appendChild(item);
      });
    }

    buildSection("Water & Wells (Left)", "water", WATER_CATEGORIES);
    buildSection("Landforms & Coastal (Right)", "landform", LANDFORM_CATEGORIES);

    // Split-screen swipe logic
    const mapContainer = document.getElementById('map-container');
    const divider = document.getElementById('swipe-divider');
    let splitRatio = 0.5;
    let isDragging = false;

    function updateClip() {
      const rect = mapContainer.getBoundingClientRect();
      const splitX = Math.round(rect.width * splitRatio);
      divider.style.left = `${splitX}px`;

      const nw = map.containerPointToLayerPoint([0, 0]);
      const se = map.containerPointToLayerPoint([rect.width, rect.height]);
      const mid = map.containerPointToLayerPoint([splitX, 0]);

      // Clip waterPane to [0 .. splitX] and landformPane to [splitX .. width]
      waterPane.style.clip = `rect(${nw.y}px, ${mid.x}px, ${se.y}px, ${nw.x}px)`;
      landformPane.style.clip = `rect(${nw.y}px, ${se.x}px, ${se.y}px, ${mid.x}px)`;
    }

    function onDragMove(clientX) {
      if (!isDragging) return;
      const rect = mapContainer.getBoundingClientRect();
      const clampedX = Math.max(24, Math.min(rect.width - 24, clientX - rect.left));
      splitRatio = clampedX / rect.width;
      updateClip();
    }

    divider.addEventListener('mousedown', (e) => {
      isDragging = true;
      e.preventDefault();
      e.stopPropagation();
    });
    window.addEventListener('mousemove', (e) => onDragMove(e.clientX));
    window.addEventListener('mouseup', () => { isDragging = false; });

    divider.addEventListener('touchstart', (e) => {
      isDragging = true;
      e.stopPropagation();
    }, { passive: true });
    window.addEventListener('touchmove', (e) => {
      if (e.touches.length > 0) onDragMove(e.touches[0].clientX);
    }, { passive: true });
    window.addEventListener('touchend', () => { isDragging = false; });

    map.on('move zoom viewreset resize', updateClip);
    window.addEventListener('resize', updateClip);
    updateClip();

    function resetSplit() {
      splitRatio = 0.5;
      updateClip();
    }

    function setLayerVisibility(layerName, visible) {
      if (visible) {
        layerGroups[layerName].addTo(map);
        items[layerName].classList.remove('inactive');
      } else {
        map.removeLayer(layerGroups[layerName]);
        items[layerName].classList.add('inactive');
      }
      updateClip();
      updateFooter();
    }

    function toggleGroup(sideKey) {
      const targetCats = sideKey === 'water' ? WATER_CATEGORIES : LANDFORM_CATEGORIES;
      const anyVisible = targetCats.some(c => checkboxes[c].checked);
      targetCats.forEach(c => {
        checkboxes[c].checked = !anyVisible;
        setLayerVisibility(c, !anyVisible);
      });
    }

    function toggleAll(visible) {
      Object.keys(LAYERS_DATA).forEach(layerName => {
        checkboxes[layerName].checked = visible;
        setLayerVisibility(layerName, visible);
      });
    }

    function updateFooter() {
      let waterTotal = 0;
      let landformTotal = 0;
      WATER_CATEGORIES.forEach(c => {
        if (checkboxes[c] && checkboxes[c].checked) waterTotal += LAYERS_DATA[c].count;
      });
      LANDFORM_CATEGORIES.forEach(c => {
        if (checkboxes[c] && checkboxes[c].checked) landformTotal += LAYERS_DATA[c].count;
      });
      document.getElementById('statusFooter').textContent =
        `Left (Water): ${waterTotal} | Right (Landform): ${landformTotal}`;
    }

    updateFooter();
  </script>
